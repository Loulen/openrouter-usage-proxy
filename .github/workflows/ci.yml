# GitHub Actions CI Workflow
# Runs continuous integration tests on pull requests and pushes to main
#
# Triggered by:
#   - Pull requests
#   - Push to main/master branch
#
# Tests:
#   - Unit tests (server and client)
#   - TypeScript type checking
#   - Client build
#   - Server build
#   - CLI compilation
#   - CLI help verification

name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server

      - name: Install client dependencies
        run: npm ci || npm install
        working-directory: client

      - name: Run server tests
        run: npm run test
        working-directory: server

      - name: Run client tests
        run: npm run test
        working-directory: client

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server

      - name: Install client dependencies
        run: npm ci || npm install
        working-directory: client

      - name: TypeScript check (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: TypeScript check (client)
        run: npx tsc --noEmit
        working-directory: client

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server

      - name: Install client dependencies
        run: npm ci || npm install
        working-directory: client

      # Build all components (client, server, CLI)
      - name: Build project
        run: npm run build

      # Verify CLI works
      - name: Test CLI
        run: node dist/cli/index.js --help

      # Upload build artifacts for debugging
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            client/dist/
            server/dist/
          retention-days: 7
