# GitHub Actions Release Workflow
# Automatically builds and releases platform-specific binaries when a version tag is pushed
#
# Triggered by:
#   - Push of version tags (v*)
#   - Manual workflow dispatch
#
# Builds:
#   - Linux (x64, arm64)
#   - macOS (x64, arm64)
#   - Windows (x64)

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: linux
            arch: x64
            runner: ubuntu-latest
            binary_suffix: ''
          # Linux arm64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            binary_suffix: ''
          # macOS arm64 (Apple Silicon)
          - os: macos
            arch: arm64
            runner: macos-latest
            binary_suffix: ''
          # Windows x64
          - os: windows
            arch: x64
            runner: windows-latest
            binary_suffix: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # Install dependencies for all packages
      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        run: npm ci || npm install
        working-directory: server

      - name: Install client dependencies
        run: npm ci || npm install
        working-directory: client

      # Build client static assets
      - name: Build client
        run: npm run build:client

      # Build server (TypeScript compilation)
      - name: Build server
        run: npm run build:server

      # Bundle with esbuild
      - name: Bundle with esbuild
        run: npm run bundle

      # Generate SEA blob
      - name: Generate SEA blob
        run: node --experimental-sea-config sea-config.json

      # Platform-specific binary creation
      - name: Create binary (Unix)
        if: matrix.os != 'windows'
        run: |
          # Copy Node.js binary
          cp "$(which node)" "dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}"

          # Remove macOS code signature (if on macOS)
          if [ "${{ matrix.os }}" = "macos" ]; then
            codesign --remove-signature "dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}" || true
          fi

          # Inject SEA blob
          npx postject \
            "dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}" \
            NODE_SEA_BLOB \
            dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            ${{ matrix.os == 'macos' && '--macho-segment-name NODE_SEA' || '' }} \
            --overwrite

          # Re-sign on macOS (ad-hoc signing)
          if [ "${{ matrix.os }}" = "macos" ]; then
            codesign --sign - "dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}"
          fi

          # Set executable permissions
          chmod +x "dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Create binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Copy Node.js binary
          Copy-Item (Get-Command node).Source "dist\openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.exe"

          # Inject SEA blob using npx postject
          npx postject `
            "dist\openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.exe" `
            NODE_SEA_BLOB `
            "dist\sea-prep.blob" `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 `
            --overwrite

      # Verify binary
      - name: Verify binary (Unix)
        if: matrix.os != 'windows'
        run: |
          ./dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }} --help

      - name: Verify binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          .\dist\openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.exe --help

      # Copy native modules alongside binary
      - name: Package native modules
        run: |
          mkdir -p dist/lib
          cp -r dist/node_modules dist/lib/node_modules || true
        shell: bash

      # Create archive with binary and native modules
      - name: Create release archive (Unix)
        if: matrix.os != 'windows'
        run: |
          cd dist
          tar -czvf openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
            openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }} \
            lib/ 2>/dev/null || \
          tar -czvf openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
            openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}

      - name: Create release archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cd dist
          $files = @("openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.exe")
          if (Test-Path "lib") {
            $files += "lib"
          }
          Compress-Archive -Path $files -DestinationPath "openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.zip"

      # Upload artifacts for release job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.binary_suffix }}
            dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dist/openrouter-proxy-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Move all archives to release-assets
          find artifacts -name "*.tar.gz" -exec mv {} release-assets/ \;
          find artifacts -name "*.zip" -exec mv {} release-assets/ \;

          # Also copy standalone binaries for quick download
          find artifacts -type f -executable -exec mv {} release-assets/ \; 2>/dev/null || true
          find artifacts -name "*.exe" -exec mv {} release-assets/ \;

          echo "Release assets:"
          ls -la release-assets/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: notes
        run: |
          cat << 'EOF' > release-notes.md
          ## OpenRouter Usage Proxy ${{ steps.tag.outputs.tag }}

          ### Installation

          Download the appropriate binary for your platform:

          | Platform | Architecture | File |
          |----------|--------------|------|
          | Linux | x64 | `openrouter-proxy-linux-x64.tar.gz` |
          | Linux | arm64 | `openrouter-proxy-linux-arm64.tar.gz` |
          | macOS | Apple Silicon | `openrouter-proxy-macos-arm64.tar.gz` |
          | Windows | x64 | `openrouter-proxy-windows-x64.zip` |

          ### Quick Start

          ```bash
          # Extract the archive
          tar -xzf openrouter-proxy-<platform>-<arch>.tar.gz

          # Run the application
          ./openrouter-proxy-<platform>-<arch> --server-port 3000
          ```

          ### CLI Options

          ```
          --server-port <port>  Server port (default: 3000)
          --client-port <port>  Client port (defaults to server port)
          --help                Show help
          --version             Show version
          ```

          ### Requirements

          - No external dependencies required (self-contained binary)
          - Native SQLite3 bindings included in the archive

          ### Checksums

          Verify your download by computing the SHA256 checksum and comparing with the values below.
          EOF

          # Generate checksums
          echo '```' >> release-notes.md
          cd release-assets
          sha256sum * 2>/dev/null || shasum -a 256 * >> ../release-notes.md
          cd ..
          echo '```' >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OpenRouter Usage Proxy ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
